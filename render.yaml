# Render Blueprint for the CloudLab console (static Vite/React build).
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repo.
#
# After cloudlab-api is deployed (separate Blueprint/repo), set
# VITE_API_BASE_URL below to its real URL, e.g.
# https://cloudlab-api.onrender.com — then also tighten that API's
# CORS_ALLOW_ORIGINS to this site's URL instead of "*".
services:
  - type: web
    runtime: static
    name: cloudlab-ui
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://cloudlab-api.onrender.com"
      # Lets the launch screen ping the emulator directly to help wake it
      # from Render's free-tier hibernation -- see src/api/readiness.ts.
      # Server-to-server calls from cloudlab-api alone were observed NOT
      # reliably waking it (9+ minutes of timeouts), while a direct browser
      # request woke it in seconds.
      - key: VITE_LOCALSTACK_URL
        value: "https://cloudlab-localstack.onrender.com"
    routes:
      # Client-side routing (react-router-dom) — any path not matching a
      # real static file falls through to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
